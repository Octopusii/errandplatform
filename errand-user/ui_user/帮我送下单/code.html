<!-- We suppress BottomNavBar as per "Transactional / Task-Focused" rule in System Prompt -->
<script>
        // Micro-interaction for Chip Selection
        const chips = document.querySelectorAll('.active-chip, .inactive-chip');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                // In a real app, this would be scoped to the parent container
                const siblings = chip.parentElement.children;
                Array.from(siblings).forEach(s => {
                    s.classList.remove('active-chip', 'bg-primary', 'text-white');
                    s.classList.add('inactive-chip', 'bg-surface-container-low', 'text-on-surface-variant');
                });
                chip.classList.add('active-chip', 'bg-primary', 'text-white');
                chip.classList.remove('inactive-chip', 'bg-surface-container-low', 'text-on-surface-variant');
            });
        });

        // Simple Range Slider Update
        const range = document.querySelector('input[type="range"]');
        const weightLabel = range.parentElement.querySelector('.text-primary');
        range.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val <= 1) weightLabel.innerText = '1kg 及以下';
            else if (val >= 20) weightLabel.innerText = '20kg 以上';
            else weightLabel.innerText = `${val}kg`;
        });
    </script>
