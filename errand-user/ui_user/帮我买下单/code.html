<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>跑腿代办 - 帮我买</title>

<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {

                    "on-primary": "#ffffff",

                    "outline": "#727687",

                    "on-surface": "#0b1c30",
                    "primary": "#0050cb",
                    "surface-tint": "#0054d6",
                    "surface-container-low": "#eff4ff",
                    "on-secondary": "#ffffff",
                    "secondary": "#515f74",
                    "surface-container-high": "#dce9ff",
                    "on-error-container": "#93000a",
                    "secondary-fixed-dim": "#b9c7e0",
                    "surface": "#f8f9ff",
                    "on-tertiary": "#ffffff",

                    "inverse-primary": "#b3c5ff",

                    "primary-container": "#0066ff",

                    "inverse-surface": "#213145",
                    "on-tertiary-fixed": "#191c1e",
                    "tertiary-container": "#6f7274",
                    "background": "#f8f9ff",
                    "on-tertiary-fixed-variant": "#444749",
                    "tertiary": "#565a5b",
                    "error-container": "#ffdad6",
                    "secondary-container": "#d5e3fd",
                    "on-error": "#ffffff",

                    "surface-variant": "#d3e4fe",
                    "on-primary-fixed-variant": "#003fa4",
                    "on-primary-container": "#f8f7ff",
                    "error": "#ba1a1a",
                    "on-secondary-fixed": "#0d1c2f",
                    "on-background": "#0b1c30",
                    "on-secondary-container": "#57657b",

            },
            "borderRadius": {

                    "lg": "0.5rem",

            "spacing": {

                    "base": "4px",
                    "stack-sm": "8px",

                    "gutter-grid": "12px",

            },
            "fontFamily": {
                    "body-md": ["Inter"],
                    "headline-md": ["Plus Jakarta Sans"],

<style>
        body { background-color: #F8FAFC; -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(8px); }
        .custom-shadow { shadow-[0px_4px_12px_rgba(0,0,0,0.05)] }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-on-surface mb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline-variant flex justify-between items-center px-margin-page h-14">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary-container/10 transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary font-bold">帮我买</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary-container/10 transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary">help_outline</span>
</button>
</header>
<main class="mt-20 px-margin-page space-y-stack-md">
<!-- Bento Grid: Main Content -->
<section class="grid grid-cols-1 gap-gutter-grid">
<!-- Item Description Card -->
<div class="bg-surface-container-lowest p-stack-md rounded-xl border border-outline-variant shadow-[0px_4px_12px_rgba(0,0,0,0.05)]">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
<h2 class="font-headline-sm text-headline-sm text-on-surface">想买什么？</h2>
</div>
<textarea class="w-full h-24 p-3 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary text-body-md placeholder:text-outline resize-none" placeholder="描述一下您想买的物品，如：一份双拼炸鸡、一盒感冒药等..."></textarea>
<!-- Quick Tags -->
<div class="flex flex-wrap gap-2 mt-4">
<button class="px-3 py-1.5 bg-secondary-container text-on-secondary-container rounded-full font-label-md text-label-md active:scale-95 transition-transform">🍔 快餐</button>
<button class="px-3 py-1.5 bg-secondary-container text-on-secondary-container rounded-full font-label-md text-label-md active:scale-95 transition-transform">💊 药品</button>
<button class="px-3 py-1.5 bg-secondary-container text-on-secondary-container rounded-full font-label-md text-label-md active:scale-95 transition-transform">☕ 咖啡</button>
<button class="px-3 py-1.5 bg-secondary-container text-on-secondary-container rounded-full font-label-md text-label-md active:scale-95 transition-transform">🧴 日用</button>
</div>
</div>
<!-- Price & Buy Location Row -->
<div class="grid grid-cols-2 gap-gutter-grid">
<!-- Estimated Price -->
<div class="bg-surface-container-lowest p-stack-md rounded-xl border border-outline-variant shadow-[0px_4px_12px_rgba(0,0,0,0.05)]">
<label class="block font-label-md text-label-md text-outline mb-2">预估商品价格</label>
<div class="flex items-center gap-1">
<span class="text-headline-sm font-bold text-on-surface">¥</span>
<input class="w-full bg-transparent border-none p-0 text-headline-sm font-bold focus:ring-0 placeholder:text-outline-variant" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Price Tip -->
<div class="bg-primary-container p-stack-md rounded-xl text-on-primary-container flex flex-col justify-center">
<p class="font-label-md text-label-md opacity-90">商品费用多退少补</p>
<p class="font-body-md text-body-md font-bold">请保留小票</p>
</div>
</div>
<!-- Address Selection Section -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-[0px_4px_12px_rgba(0,0,0,0.05)] overflow-hidden">
<div class="p-stack-md border-b border-outline-variant flex justify-between items-center bg-surface-container-low/50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">location_on</span>
<h2 class="font-headline-sm text-headline-sm text-on-surface">购买地址</h2>
</div>
</div>
<div class="p-base">
<!-- Tabs -->
<div class="flex p-1 bg-surface-container-low rounded-lg m-2">
<button class="flex-1 py-2 rounded-md text-label-md font-label-md bg-white shadow-sm text-primary transition-all duration-200" id="near-btn" onclick="toggleAddressMode('near')">就近购买</button>
<button class="flex-1 py-2 rounded-md text-label-md font-label-md text-outline transition-all duration-200" id="fixed-btn" onclick="toggleAddressMode('fixed')">指定地址</button>
</div>
<!-- Near Address Content -->
<div class="px-stack-md py-4" id="near-content">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">explore</span>
</div>
<div>
<p class="text-body-md font-bold text-on-surface">系统自动匹配最近商圈</p>
<p class="text-label-md text-outline">省时省事，骑手将就近为您选购</p>
</div>
</div>
</div>
<!-- Fixed Address Content (Hidden by default) -->
<div class="hidden px-stack-md py-4 space-y-3" id="fixed-content">
<div class="flex items-center justify-between p-3 bg-surface-container-low rounded-xl">
<span class="text-body-md text-outline">去哪儿买？</span>
<span class="material-symbols-outlined text-primary">chevron_right</span>
</div>
</div>
</div>
</div>
<!-- Delivery Address -->
<div class="bg-surface-container-lowest p-stack-md rounded-xl border border-outline-variant shadow-[0px_4px_12px_rgba(0,0,0,0.05)] flex items-center justify-between">
<div class="flex gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container/30 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary">home</span>
</div>
<div>
<p class="text-body-md font-bold text-on-surface">送到哪里？</p>
<p class="text-label-md text-outline">点击选择收货地址</p>
</div>
</div>
<button class="text-primary font-label-md text-label-md">选择</button>
</div>
<!-- Remarks -->
<div class="bg-surface-container-lowest p-stack-md rounded-xl border border-outline-variant shadow-[0px_4px_12px_rgba(0,0,0,0.05)]">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-primary">edit_note</span>
<h2 class="font-headline-sm text-headline-sm text-on-surface">下单备注</h2>
</div>
<input class="w-full p-3 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary text-body-md placeholder:text-outline" placeholder="给骑手带句话..." type="text"/>
</div>
</section>
<!-- Fee Details Breakdown -->
<section class="bg-surface-container-low/50 p-stack-md rounded-xl border border-dashed border-outline-variant">
<div class="flex justify-between mb-2">
<span class="text-label-md text-on-surface-variant">基础配送费</span>
<span class="text-label-md font-bold">¥5.00</span>
</div>
<div class="flex justify-between mb-2">
<span class="text-label-md text-on-surface-variant">距离附加 (1.2km)</span>
<span class="text-label-md font-bold">¥2.00</span>
</div>
<div class="flex justify-between mb-2">
<span class="text-label-md text-on-surface-variant">夜间服务费</span>
<span class="text-label-md font-bold">¥0.00</span>
</div>
<div class="h-px bg-outline-variant my-3"></div>
<div class="flex justify-between items-center">
<span class="text-body-md font-bold text-on-surface">预计配送费</span>
<span class="text-headline-sm font-bold text-primary">¥7.00</span>
</div>
</section>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 w-full z-50 bg-surface-container-lowest border-t border-outline-variant shadow-[0px_-4px_12px_rgba(0,0,0,0.05)] pb-safe">
<div class="flex justify-between items-center px-margin-page h-20">
<div class="flex flex-col">
<div class="flex items-baseline gap-1">
<span class="text-label-md text-outline">待支付</span>
<span class="text-headline-lg-mobile font-bold text-primary">¥7.00</span>
</div>
<p class="text-[10px] text-outline">不含商品费用，由骑手垫付</p>
</div>
<button class="bg-primary hover:bg-primary/90 text-on-primary px-8 py-3.5 rounded-full font-headline-sm shadow-lg active:scale-95 transition-all">
                立即下单
            </button>
</div>
</footer>
<script>
        function toggleAddressMode(mode) {
            const nearBtn = document.getElementById('near-btn');
            const fixedBtn = document.getElementById('fixed-btn');
            const nearContent = document.getElementById('near-content');
            const fixedContent = document.getElementById('fixed-content');

            if (mode === 'near') {
                nearBtn.classList.add('bg-white', 'shadow-sm', 'text-primary');
                nearBtn.classList.remove('text-outline');
                fixedBtn.classList.remove('bg-white', 'shadow-sm', 'text-primary');
                fixedBtn.classList.add('text-outline');
                nearContent.classList.remove('hidden');
                fixedContent.classList.add('hidden');
            } else {
                fixedBtn.classList.add('bg-white', 'shadow-sm', 'text-primary');
                fixedBtn.classList.remove('text-outline');
                nearBtn.classList.remove('bg-white', 'shadow-sm', 'text-primary');
                nearBtn.classList.add('text-outline');
                fixedContent.classList.remove('hidden');
                nearContent.classList.add('hidden');
            }
        }

        // Simple button interaction feedback
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.classList.add('scale-95');
            });
            btn.addEventListener('touchend', () => {
                btn.classList.remove('scale-95');
            });
        });
    </script>
</body></html>
