<span class="material-symbols-outlined text-primary-fixed">info</span>
<span class="font-body-md text-body-md" id="toast-text">请先登录后操作</span>
</div>
<script>
        function showToast(message = "请先登录后操作") {
            const toast = document.getElementById('login-toast');
            const text = document.getElementById('toast-text');
            text.innerText = message;
            
            toast.classList.remove('opacity-0', 'scale-90');
            toast.classList.add('opacity-100', 'scale-100');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'scale-100');
                toast.classList.add('opacity-0', 'scale-90');
            }, 2500);

            // Subtle vibration feedback
            if (window.navigator.vibrate) {
                window.navigator.vibrate(50);
            }
        }

        // Handle Safe Area for bottom nav on mobile
        function updateSafeArea() {
            const nav = document.querySelector('nav');
            const bottomPadding = window.getComputedStyle(document.body).getPropertyValue('padding-bottom');
            // This is a placeholder for actual safe-area-inset-bottom logic
        }
        window.addEventListener('resize', updateSafeArea);
        updateSafeArea();
    </script>
