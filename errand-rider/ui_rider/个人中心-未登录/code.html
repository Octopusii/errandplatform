<script>
    // Interaction feedback for the login button
    document.getElementById('login-btn').addEventListener('click', function() {
      console.log('Navigating to login...');
      this.classList.add('opacity-90');
      setTimeout(() => this.classList.remove('opacity-90'), 200);
    });

    // Ripple effect for list items
    document.querySelectorAll('.group').forEach(item => {
      item.addEventListener('click', function() {
        const ripple = document.createElement('div');
        ripple.className = 'absolute inset-0 bg-primary/5 pointer-events-none transition-opacity duration-300';
        this.style.position = 'relative';
        this.appendChild(ripple);
        setTimeout(() => ripple.style.opacity = '0', 300);
        setTimeout(() => ripple.remove(), 600);
      });
    });
  </script>
