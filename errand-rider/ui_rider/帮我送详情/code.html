<span class="material-symbols-outlined">bolt</span>
        立即抢单
      </button>
</div>
</div>
<script>
    document.getElementById('grabBtn').addEventListener('click', function() {
      const btn = this;
      const originalContent = btn.innerHTML;
      
      // Haptic/Visual feedback
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> 抢单中...';
      btn.classList.replace('bg-primary', 'bg-primary-container');
      btn.disabled = true;

      setTimeout(() => {
        btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> 抢单成功';
        btn.classList.replace('bg-primary-container', 'bg-secondary');
        
        // Simple particle effect simulation
        const colors = ['#003b9a', '#d2e1fa', '#1155d0'];
        for(let i = 0; i < 15; i++) {
          const p = document.createElement('div');
          p.style.position = 'fixed';
          p.style.left = '50%';
          p.style.bottom = '40px';
          p.style.width = '8px';
          p.style.height = '8px';
          p.style.borderRadius = '50%';
          p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          p.style.zIndex = '100';
          document.body.appendChild(p);
          
          const angle = (Math.random() * Math.PI) - Math.PI;
          const dist = 50 + Math.random() * 150;
          
          p.animate([
            { transform: 'translate(0, 0) scale(1)', opacity: 1 },
            { transform: `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) scale(0)`, opacity: 0 }
          ], {
            duration: 800,
            easing: 'cubic-bezier(0, .9, .57, 1)'
          }).onfinish = () => p.remove();
        }
      }, 1200);
    });
  </script>
