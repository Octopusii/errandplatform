  </head><body class="bg-surface text-on-surface font-body-md"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-4 flex items-center gap-4"><button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm">订单详情</h1></div></header><main class="pt-14 bg-surface min-h-screen"><div class="flex flex-col w-full p-margin-page gap-stack-lg">
<!-- Success Animation & Feedback Section -->
<div class="flex flex-col items-center justify-center pt-stack-lg pb-stack-md text-center">
<div class="relative mb-stack-md">
<!-- Animated Pulse Ring -->
<div class="absolute inset-0 rounded-full bg-primary/20 animate-ping"></div>
<!-- Success Icon -->
<div class="relative w-24 h-24 bg-primary text-on-primary rounded-full flex items-center justify-center shadow-xl shadow-primary/30 transform transition-transform duration-500 scale-110">
<span class="material-symbols-outlined !text-[48px]" style="font-variation-settings: 'FILL' 1, 'wght' 600;">check_circle</span>
</div>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-base">抢单成功！</h2>
<p class="font-body-lg text-on-surface-variant">请尽快前往取货，以免订单超时</p>
</div>
<!-- Order Preview Card -->
<div class="bg-surface-container-low rounded-xl p-stack-md shadow-sm flex flex-col gap-stack-md">
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-primary bg-primary-fixed px-2 py-0.5 rounded-full w-fit mb-base">待取货</span>
<h3 class="font-headline-sm text-headline-sm text-on-surface">星巴克 (南山科技园店)</h3>
</div>
<div class="text-right">
<p class="font-label-md text-label-md text-on-surface-variant">预计配送收入</p>
<p class="font-headline-md text-headline-md text-primary">¥18.50</p>
</div>
</div>
<div class="space-y-stack-sm">
<div class="flex items-start gap-stack-sm">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">location_on</span>
<div class="flex flex-col">
<p class="font-body-md text-on-surface">广东省深圳市南山区科苑路15号</p>
<p class="font-label-md text-label-md text-on-surface-variant">距离您 850m</p>
</div>
</div>
<div class="flex items-center gap-stack-sm">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">schedule</span>
<p class="font-body-md text-on-surface">请在 <span class="text-error font-medium">15:30</span> 前完成取货</p>
</div>
</div>
<!-- Mini Progress Visual -->
<div class="flex items-center gap-2 mt-base">
<div class="h-1.5 flex-1 bg-primary rounded-full"></div>
<div class="h-1.5 flex-1 bg-outline-variant rounded-full"></div>
<div class="h-1.5 flex-1 bg-outline-variant rounded-full"></div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-stack-md mt-auto">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-headline-sm flex items-center justify-center gap-stack-sm active:scale-95 transition-transform shadow-md shadow-primary/20" id="mainAction">
<span class="material-symbols-outlined">navigation</span>
      立即前往取货
    </button>
<button class="w-full h-14 bg-surface-container-highest text-on-surface-variant rounded-xl font-headline-sm flex items-center justify-center active:scale-95 transition-transform">
      查看订单详情
    </button>
</div>
<!-- Subtle Tip -->
<div class="flex items-center justify-center gap-1 opacity-60">

<p class="font-label-md text-label-md text-on-surface-variant">取货时请核对订单号：#8829</p>
</div>
<script>
    // Micro-interaction for the success icon
    document.addEventListener('DOMContentLoaded', () => {
      const icon = document.querySelector('.w-24.h-24');
      icon.classList.add('animate-bounce-short');
      
      // confetti effect mock
      const mainBtn = document.getElementById('mainAction');
      mainBtn.addEventListener('click', () => {
        mainBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> 正在开启地图...';
        setTimeout(() => {
          mainBtn.innerHTML = '<span class="material-symbols-outlined">navigation</span> 立即前往取货';
        }, 2000);
      });
    });
  </script>
<style>
    @keyframes bounce-short {
      0%, 100% { transform: scale(1.1); }
      50% { transform: scale(1.2); }
    }
    .animate-bounce-short {
      animation: bounce-short 0.6s ease-out 1;
    }
  </style>
